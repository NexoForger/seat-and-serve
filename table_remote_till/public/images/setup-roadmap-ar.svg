<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">مراحل إعداد TRT</title><desc id="desc">ست مراحل من إعداد الشركة والحسابات إلى تجربة متطابقة وتدريب الموظفين.</desc>
  <rect width="1200" height="340" rx="24" fill="#f4f7f5"/><path d="M123 140H1077" stroke="#9aafa5" stroke-width="5"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#b7c9c1" stroke-width="2"><circle cx="125" cy="140" r="54"/><circle cx="315" cy="140" r="54"/><circle cx="505" cy="140" r="54"/><circle cx="695" cy="140" r="54"/><circle cx="885" cy="140" r="54"/><circle cx="1075" cy="140" r="54"/></g>
  <g fill="#173d36"><text x="125" y="148" font-size="25" font-weight="700">١</text><text x="315" y="148" font-size="25" font-weight="700">٢</text><text x="505" y="148" font-size="25" font-weight="700">٣</text><text x="695" y="148" font-size="25" font-weight="700">٤</text><text x="885" y="148" font-size="25" font-weight="700">٥</text><text x="1075" y="148" font-size="25" font-weight="700">٦</text></g>
  <g fill="#173d36" font-size="18" font-weight="700"><text x="125" y="225"><tspan x="125">الشركة</tspan><tspan x="125" dy="24">والحسابات</tspan></text><text x="315" y="225"><tspan x="315">المنفذ</tspan><tspan x="315" dy="24">والقنوات</tspan></text><text x="505" y="225"><tspan x="505">الأصناف</tspan><tspan x="505" dy="24">والوصفات</tspan></text><text x="695" y="225"><tspan x="695">القائمة</tspan><tspan x="695" dy="24">والمطبخ</tspan></text><text x="885" y="225"><tspan x="885">الموظفون</tspan><tspan x="885" dy="24">والتدريب</tspan></text><text x="1075" y="225"><tspan x="1075">التجربة</tspan><tspan x="1075" dy="24">والمطابقة</tspan></text></g>
  <text x="600" y="315" fill="#52656b" font-size="15">اعتماد المحاسبة أولاً · ثم القائمة والمخزون · والبيع بعد تجربة ومطابقة كاملة</text></g>
