<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">دورة الخدمة في S&S (Seat & Serve)</title><desc id="desc">الضيف يطلب من قائمة يتحقق منها الخادم؛ ثم يتابع المطبخ الطلب، ويخدمه النادل، وتسجل الفاتورة والدفعة في ERPNext.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52656b"/></marker></defs><rect width="1200" height="300" rx="24" fill="#f4f7f5"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#b7c9c1" stroke-width="2"><rect x="35" y="85" width="190" height="125" rx="18"/><rect x="275" y="85" width="190" height="125" rx="18"/><rect x="515" y="85" width="190" height="125" rx="18"/><rect x="755" y="85" width="190" height="125" rx="18"/><rect x="995" y="85" width="170" height="125" rx="18"/></g>
  <g fill="#173d36"><text x="130" y="130" font-size="23" font-weight="700">الضيف</text><text x="130" y="165" font-size="16">QR · كشك · موظف</text><text x="370" y="130" font-size="23" font-weight="700">الطلب</text><text x="370" y="165" font-size="16">قائمة · طاولة · تذكرة</text><text x="610" y="130" font-size="23" font-weight="700">المطبخ</text><text x="610" y="165" font-size="16">تحضير · جاهز</text><text x="850" y="130" font-size="23" font-weight="700">الخدمة</text><text x="850" y="165" font-size="16">استلام · تقديم</text><text x="1080" y="130" font-size="23" font-weight="700">ERPNext</text><text x="1080" y="165" font-size="16">فاتورة · دفعة</text></g>
  <g fill="none" stroke="#52656b" stroke-width="3" marker-end="url(#arrow)"><path d="M230 147H264"/><path d="M470 147H504"/><path d="M710 147H744"/><path d="M950 147H984"/></g><text x="600" y="258" fill="#52656b" font-size="16">يتحقق الخادم من الأسعار، ويتابع المطبخ التنفيذ بنداً بنداً.</text></g>
</svg>
